<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --primary: #2563eb;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 3rem 2rem;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 640px; width: 100%; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .dek { color: var(--text-secondary); font-size: 0.9375rem; margin-bottom: 2.5rem; }
        .tool-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .tool-card {
            display: block;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.15s ease, border-color 0.15s ease;
        }
        .tool-card:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }
        .tool-name { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
        .tool-desc { font-size: 0.8125rem; color: var(--text-secondary); }
    </style>
</head>
<body>
<div class="container">
    <h1>Tools</h1>
    <p class="dek">A small, growing set of standalone utilities.</p>
    <div class="tool-list">
        <a class="tool-card" href="intrinsic-value-calculator/">
            <div class="tool-name">Intrinsic Value Calculator</div>
            <div class="tool-desc">DCF fair-value calculator with owners'-earnings adjustment, blended perpetuity / Year-15 valuation, and IV8&ndash;IV15 hurdle rates.</div>
        </a>
    </div>
</div>
</body>
</html>
